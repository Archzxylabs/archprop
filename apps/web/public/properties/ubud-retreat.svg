<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ubud Retreat, a residence among terraced greenery">
  <defs>
    <linearGradient id="ubud-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8ead8"/>
      <stop offset="100%" stop-color="#f2f7ec"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#ubud-sky)"/>

  <!-- Canopy hills -->
  <path d="M0 260q140-70 300-30t300-40 200 40v90H0z" fill="#6b9a63"/>
  <path d="M0 330q160-60 320-20t320-30 160 30v80H0z" fill="#5c8a56"/>

  <!-- Rice terraces -->
  <g fill="#8fbf72">
    <path d="M0 430q200-30 400 0t400-10v40H0z"/>
    <path d="M0 470q200-30 400 0t400-10v40H0z" fill="#7fae63"/>
    <path d="M0 510q200-30 400 0t400-10v40H0z" fill="#6f9d56"/>
    <path d="M0 550q200-30 400 0t400-10v50H0z" fill="#5f8c49"/>
  </g>

  <!-- Residence -->
  <g>
    <rect x="290" y="300" width="220" height="110" fill="#f4efe4"/>
    <rect x="290" y="300" width="220" height="8" fill="#7a5b3a"/>
    <path d="M270 300l130-52 130 52z" fill="#5f4632"/>
    <!-- Open veranda on stilts -->
    <rect x="310" y="360" width="180" height="6" fill="#8c6a48"/>
    <rect x="318" y="366" width="10" height="44" fill="#7a5b3a"/>
    <rect x="472" y="366" width="10" height="44" fill="#7a5b3a"/>
    <!-- Windows -->
    <rect x="330" y="330" width="60" height="34" fill="#4d6b78"/>
    <rect x="410" y="330" width="60" height="34" fill="#4d6b78"/>
  </g>

  <!-- Tropical foliage -->
  <g fill="#3f6b3c">
    <path d="M120 470c0-40 6-70 8-84 2 14 8 44 8 84z" fill="#6b5138"/>
    <path d="M128 386c-30-12-48-4-58 8 20-12 38-10 58-2z"/>
    <path d="M128 386c30-14 50-6 60 6-20-12-38-10-60-2z"/>
    <path d="M128 386c-22-22-22-42-18-54 6 20 16 32 30 40z"/>
    <path d="M128 386c22-24 24-44 20-56-6 20-16 34-30 44z"/>
  </g>
  <g fill="#3f6b3c">
    <path d="M670 480c0-36 5-64 7-76 2 12 7 40 7 76z" fill="#6b5138"/>
    <path d="M677 404c-28-10-44-4-54 8 18-10 36-8 54-2z"/>
    <path d="M677 404c28-12 46-4 56 6-18-10-36-8-56-2z"/>
    <path d="M677 404c-20-20-20-38-16-48 6 18 14 28 28 36z"/>
    <path d="M677 404c20-22 22-40 18-50-6 18-14 30-28 40z"/>
  </g>
</svg>
